<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026-01-27-formular</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body>

    <form id="orderForm">
      <label>
        <span class="required">Förnamn</span>
        <input type="text" id="firstname" name="firstname" autocomplete="given-name" required>
        <span class="hidden error">Fel: Förnamn behöver minst två bokstäver</span>
      </label>

      <label>
        <span>E-post</span>
        <input type="email" id="email" name="email" autocomplete="email" required>
        <span class="hidden error">Fel: E-postadressen har fel format</span>
      </label>

      <label>
        <span>Faktura-referens (frivilligt)</span>
        <input type="text">
      </label>

      <input type="radio" name="invoiceOrCard" value="invoice">
      <input type="radio" name="invoiceOrCard" value="card">

      <div id="cardPayment">kort</div>
      <div id="invoicePayment">faktura</div>

      <button id="orderBtn" disabled>Beställ</button>
    </form>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
