<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget-app</title>
  </head>
  <body>
    <main class="p-4 max-w-prose mx-auto">
      <h1 class="text-2xl font-bold mb-8 text-center">Min budget-app</h1>

      <form id="budgetForm">
        <fieldset>
          <label>
            <span>Beskrivning</span>
            <input type="text" name="desc" value="Test">
          </label>
        </fieldset>
        <fieldset>
          <label>
            <span>Belopp (kr)</span>
            <input type="number" placeholder="1000" name="amount" value="1000">
          </label>
        </fieldset>
        <fieldset class="flex gap-8 items-start">
          <span class="inline-block w-28">Utgiftstyp</span>
          <label class="gap-1">
            <input type="radio" name="type" value="expense" checked>
            <span>Kostnad</span>
          </label>
          <label class="gap-1">
            <input type="radio" name="type" value="income">
            <span>Intäkt</span>
          </label>
        </fieldset>

        <button class="text-black bg-amber-300 px-4 py-2 cursor-pointer">Registrera</button>
      </form>

      <section class="mt-8">
        <h2 class="text-xl font-bold mb-4">Utgifter</h2>
        <div id="budgetItemsList"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
