<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026-01-27-formular</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body>

    <header>
      <section>
        <span class="material-symbols-outlined">shopping_cart</span>
        <span id="cartTotalHeader">0 kr</span>
      </section>
    </header>

    <section id="orderSummary">
      <p id="discount"></p>
      <p>Totalsumma inkl. frakt: <span id="cartTotal">0 kr</span></p>
      <p id="shippingCost"></p>
    </section>

    <form id="orderForm">
      <label>
        <span class="required">Förnamn</span>
        <input type="text" id="firstname" name="firstname" autocomplete="given-name" required>
        <span class="hidden error">Fel: Förnamn behöver minst två bokstäver</span>
      </label>

      <label>
        <span>E-post</span>
        <input type="email" id="email" name="email" autocomplete="email" required>
        <span class="hidden error">Fel: E-postadressen har fel format</span>
      </label>

      <label>
        <span>Faktura-referens (frivilligt)</span>
        <input type="text">
      </label>

      <label>
        <span>Kort</span>
        <input type="radio" name="invoiceOrCard" value="card" class="card" checked>
      </label>

      <label>
        <span>Faktura</span>
        <input type="radio" name="invoiceOrCard" value="invoice" class="invoice">
      </label>

      <div id="cardPayment">
        <label>
          <span>Kortnummer</span>
          <input type="number">
        </label>
        <label>
          <span>ÅÅ</span>
          <input type="number">
        </label>
        <label>
          <span>MM</span>
          <input type="number">
        </label>
        <label>
          <span>CVC</span>
          <input type="number">
        </label>
      </div>
      <div class="hidden" id="invoicePayment">faktura</div>

      <button id="orderBtn" disabled>Beställ</button>
    </form>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
